<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/JeromeCyiza_beatsbydre_css_clone/style.css">
</head>

<body>
    <header>
        
<nav id="nav-bar">

    
    <div class="nav-logo">
        <img src="Assets/logo.png" alt="Beats logo">
    </div>

  
    <ul class="nav-list">
        <li><a href="#">Shop</a></li>

        <li class="gift-guide">
            <a href="#">Gift Guide</a>
            <img src="Assets/Icon 1.svg" alt="Gift">
        </li>

        <li><a href="#">Support</a></li>
    </ul>

   
    <div class="nav-icons">
        <img src="Assets/search.svg" alt="Search">
        <img src="Assets/Icon 1.svg" alt="Shopping bag">
    </div>

</nav>

    </header>

    <main>
        <section id="hero-section">
            <img class="background-image" src="Assets/hero section.jpg" alt="Hero background">
        <div class="hero-content">
            <h4 class="artist-name">Kendall Jenner</h4>
            <h1 class="hero-title">Beats<span>360</span></h1>
            <p class="hero-description">One headphone. Every version of you.'</p>
         <div class="hero-buttons">
            <button class="btn shop-btn">Shop Now</button>
            <button class="btn customize-btn">Customize</button>
        </div>
        </div>
            <img class="customize-icon" src="https://cdn-icons-png.flaticon.com/512/8068/8068663.png" alt="Customize icon">
        </section>
        <section id="products-section">
            <div class="product-container">
                <div class="artist-favorite">
                    <h2>Kendall's Favorite</h2>
                </div>
                <div class="product">
                    <p>New</p>
                    <h1>Beats 360</h1>
                    <h3>$349.99</h3>
                    <img src="Assets/Product 1.jpg" alt="Product 1">
                </div>
    
            <div class="product">
                <p>New</p>
                <h1>Beats 360 Cushion Kit- Perfomance knit</h1>
                <h3>$49.99</h3>
                <img src="Assets/Product 2.jpg" alt="Product 2">
            </div>
            <div class="product">
                <p>New</p>
                <h1>Beats Flex</h1>
                <h3>$49.99</h3>
                <img src="Assets/Product 3.jpg" alt="Product 3">
            </div>

    </main>
    <script src="script.js"></script>
</body>
</html>
